[project]
name = "agent-execution-framework"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.1", "uvicorn==0.35.0", "psycopg[binary]==3.2.6",
  "psycopg-pool==3.3.3", "httpx==0.28.1", "starlette==1.8.0",
  "fastmcp-slim[client]==4.0.1", "fastmcp-tasks==4.0.1", "mcp==2.3.0", "jsonschema==4.26.0",
  "langchain==1.4.2", "langgraph==1.2.12", "langchain-openai==1.6.4",
  "langgraph-checkpoint-postgres==3.1.2",
  "alembic==1.15.2", "sqlalchemy==2.0.40", "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

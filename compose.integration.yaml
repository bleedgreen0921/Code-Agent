services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_INTEGRATION_PASSWORD:?Set a test-only password}
      POSTGRES_DB: agent_integration
    ports:
      - "127.0.0.1:${POSTGRES_INTEGRATION_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_integration"]
      interval: 1s
      timeout: 3s
      retries: 30
